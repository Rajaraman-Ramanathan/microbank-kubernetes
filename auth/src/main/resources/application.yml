spring:
  application:
    name: auth-service

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.microbank.local/realms/microbank

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

keycloak:
  refresh-token:
    grant-type: "refresh_token"
