name: microbank-ci-dev

on:
  push:
    branches:
      - dev

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_BUILDKIT: 1

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 21
            cache: maven
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./account
            file: ./account/Dockerfile
            push: true
            tags: |
              ${{ env.IMAGE_NAMESPACE }}/account-service:1.0.${{ github.run_number }}
              ${{ env.IMAGE_NAMESPACE }}/account-service:${{ github.sha }}
            cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/account-service:buildcache
            cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/account-service:buildcache,mode=max
    
