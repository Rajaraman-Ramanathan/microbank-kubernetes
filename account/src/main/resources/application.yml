spring:
  application:
    name: account-service

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.dev.microbankapp.com/realms/microbank
          jwk-set-uri: http://auth.dev.microbankapp.com/realms/microbank/protocol/openid-connect/certs

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

