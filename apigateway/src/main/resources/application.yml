spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: transaction-service
          uri: http://transaction-service
          predicates:
             - Path=/api/v1/transactions/**

        - id: auth-service
          uri: http://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: account-service
          uri: http://account-service
          predicates:
            - Path=/api/v1/accounts/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak/realms/microbank
          jwk-set-uri: http://keycloak/realms/microbank/protocol/openid-connect/certs

management:
  server:
    port: 8123
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

