apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microbank-ingress
  namespace: microbank-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: api.microbank.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
