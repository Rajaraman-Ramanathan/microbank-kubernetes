apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: microbank-dev
  labels:
    app: account-service
spec:
  replicas: 1   # DEV
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
      - name: account-service
        image: microbank/account-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: docker

        # Postgres (account DB)
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-account:5432/account_db
        - name: SPRING_DATASOURCE_USERNAME
          value: account_db
        - name: SPRING_DATASOURCE_PASSWORD
          value: account_db
