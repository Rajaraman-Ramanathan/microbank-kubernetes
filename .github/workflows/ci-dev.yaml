name: microbank-ci-dev-v1

on:
  push:
    branches:
      - dev

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_BUILDKIT: 1

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            service:
              - account
              - apigateway
              - auth
              - document
              - notification
              - transaction

        steps:
        - name: Show workflow execution context
          run: |
            echo "===== WORKFLOW DEBUG ====="
            echo "Workflow file: $GITHUB_WORKFLOW"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF"
            echo "Ref name: $GITHUB_REF_NAME"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Actor: $GITHUB_ACTOR"
            echo "=========================="
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Set up JDK 21
          if: contains(matrix.service, 'service')
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 21
            cache: maven
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: ./${{ matrix.service }}
            push: true
            tags: |
              ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:1.0.${{ github.run_number }}
              ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:${{ github.sha }}
            cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache
            cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache,mode=max
    
