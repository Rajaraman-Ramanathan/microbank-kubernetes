name: microbank-ci-dev-v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - dev

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_BUILDKIT: 1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            account:
              - 'account/**'
            apigateway:
              - 'apigateway/**'
            auth:
              - 'auth/**'
            document:
              - 'document/**'
            notification:
              - 'notification/**'
            transaction:
              - 'transaction/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}     
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:1.0.${{ github.run_number }}
          ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache,mode=max
    - name: Build summary
      run: |
        echo "Built service: ${{ matrix.service }}-service" >> $GITHUB_STEP_SUMMARY

  update-deploy-version:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    concurrency:
      group: update-deploy-version-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: Rajaraman-Ramanathan/microbank-gitops
        ref: dev
        token: ${{ secrets.GITOPS_PAT }}
        path: microbank-gitops
    - name: Debug GitOps repo
      run: |
        ls -R microbank-gitops
    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq
    - name: Update image tag
      run: |
        VERSION=1.0.${{ github.run_number }}
        yq -i '.spec.template.spec.containers[0].image = "${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:" + strenv(VERSION)' ./microbank-gitops/k8s-manifest/dev/${{ matrix.service }}/deployment.yaml
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gitops-${{ matrix.service }}
        path: microbank-gitops/k8s-manifest/dev/${{ matrix.service }}/deployment.yaml
    
  commit-gitops-repo:
    needs: update-deploy-version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: Rajaraman-Ramanathan/microbank-gitops
        ref: dev
        token: ${{ secrets.GITOPS_PAT }}
        path: microbank-gitops
    - name: Download updated manifests
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Apply manifest updates
      run: |
        cp -r artifacts/* microbank-gitops/k8s-manifest/dev/
    - name: Commit and push changes
      run: |
        cd microbank-gitops
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Update ${{ matrix.service }} image to 1.0.${{ github.run_number }}" || echo "No change"
        git push origin dev