name: microbank-ci-dev-v1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - dev

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
  DOCKER_BUILDKIT: 1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            account:
              - 'account/**'
            apigateway:
              - 'apigateway/**'
            auth:
              - 'auth/**'
            document:
              - 'document/**'
            notification:
              - 'notification/**'
            transaction:
              - 'transaction/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}     
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:1.0.${{ github.run_number }}
          ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache
        cache-to: type=registry,ref=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}-service:buildcache,mode=max
    - name: Build summary
      run: |
        echo "Built service: ${{ matrix.service }}-service" >> $GITHUB_STEP_SUMMARY
    
