server:
  port: 8084

spring:
  application:
    name: document-service

  datasource:
    url: jdbc:postgresql://postgres-document-service:5432/document_db
    username: document_db
    password: document_db
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

  cloud:
    discovery:
      enabled: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/microbank
          jwk-set-uri: http://keycloak:8080/realms/microbank/protocol/openid-connect/certs
          

minio:
  endpoint: http://minio:9000
  access-key: capellax
  secret-key: 12345678
  bucket-name: documents

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

